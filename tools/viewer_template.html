<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>rondolabs hata görüntüleyici</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --text:#e6e8ec; --muted:#8b93a3;
          --H:#3b82f6; --A:#f59e0b; --D:#6b7280; --U:#1f232b; --err:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.4 system-ui,-apple-system,Segoe UI,sans-serif; }
  header { display:flex; gap:18px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  .pill { padding:3px 8px; border:1px solid var(--line); border-radius:999px; color:var(--muted); }
  .pill b { color:var(--text); font-weight:600; }
  label.pk { cursor:pointer; padding:3px 9px; border-radius:6px; border:1px solid var(--line); }
  label.pk.on { background:#263042; border-color:#3d4b66; }
  main { display:grid; grid-template-columns: minmax(560px, 1fr) 470px; gap:12px; padding:12px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; }
  canvas { display:block; width:100%; }
  .controls { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  button, select { background:#222733; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px 9px; font:inherit; cursor:pointer; }
  button:hover { border-color:#4b5568; }
  .clock { font-variant-numeric:tabular-nums; color:var(--muted); min-width:250px; }
  .legend { display:flex; gap:12px; color:var(--muted); font-size:12px; margin-top:6px; flex-wrap:wrap; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
  #eplist { height:520px; overflow:auto; margin-top:8px; border-top:1px solid var(--line); }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { padding:4px 6px; border-bottom:1px solid #20242d; text-align:left; white-space:nowrap; }
  th { position:sticky; top:0; background:var(--panel); color:var(--muted); font-weight:500; cursor:pointer; }
  tr.ep { cursor:pointer; }
  tr.ep:hover { background:#1e2330; }
  tr.ep.cur { background:#2a3347; }
  .cats { display:flex; flex-wrap:wrap; gap:6px; }
  .cat { padding:2px 7px; border-radius:6px; border:1px solid var(--line); cursor:pointer; color:var(--muted); font-size:12px; }
  .cat.on { color:var(--text); background:#263042; border-color:#3d4b66; }
  .full { grid-column: 1 / -1; }
  .hint { color:var(--muted); font-size:12px; }
  .info { margin-top:8px; color:var(--muted); font-size:12px; min-height:36px; }
  .info b { color:var(--text); }
</style>
</head>
<body>
<header>
  <h1 id="title">—</h1>
  <span id="pkgs"></span>
  <span id="scores"></span>
</header>
<main>
  <section class="panel">
    <canvas id="pitch" width="1100" height="720"></canvas>
    <div class="controls">
      <button id="play">▶ Oynat</button>
      <button data-step="-1s">−1 sn</button><button data-step="-1">−1 kare</button>
      <button data-step="1">+1 kare</button><button data-step="1s">+1 sn</button>
      <select id="speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
      <select id="win"><option value="20">pencere 20 sn</option><option value="60" selected>pencere 60 sn</option><option value="180">pencere 3 dk</option></select>
      <button id="prevep">◀ önceki hata</button><button id="nextep">sonraki hata ▶</button>
      <span class="clock" id="clock"></span>
    </div>
    <div class="legend">
      <span><span class="sw" style="background:var(--H)"></span>H (ev)</span>
      <span><span class="sw" style="background:var(--A)"></span>A (deplasman)</span>
      <span><span class="sw" style="background:var(--D)"></span>D (ölü top)</span>
      <span><span class="sw" style="background:var(--err)"></span>tahmin ≠ gerçek</span>
      <span class="hint">Kısayollar: boşluk oynat/durdur · ←/→ 1 kare · Shift+←/→ 1 sn · N/P sonraki/önceki hata</span>
    </div>
    <div class="info" id="info"></div>
  </section>
  <section class="panel">
    <div class="cats" id="cats"></div>
    <div class="hint" style="margin-top:6px" id="catnote"></div>
    <div id="eplist"><table><thead><tr>
      <th data-k="start">zaman</th><th data-k="kind">tür</th><th data-k="cat">kategori</th><th data-k="team">takım</th>
      <th data-k="dur">süre</th><th data-k="iou">IoU</th><th data-k="ball">top görünür</th><th data-k="other">karşı/ölü</th>
    </tr></thead><tbody id="eps"></tbody></table></div>
  </section>
  <section class="panel full">
    <canvas id="tl" width="1600" height="300"></canvas>
    <canvas id="mini" width="1600" height="54" style="margin-top:6px;cursor:pointer"></canvas>
    <div class="hint" style="margin-top:4px">Üst: yakın pencere (tıkla → git). Alt: tüm maç, kırmızı = seçili paketin hatalı kareleri.</div>
  </section>
</main>
<script>
const D = /*__DATA__*/null;
const COL = { 0:'#3b82f6', 1:'#f59e0b', 2:'#6b7280', '-1':'#1f232b' };
const TEAMNAME = { 0:'H', 1:'A', 2:'D', '-1':'—' };
const CATNOTE = {
  'short<2s':'Gerçek sahiplik 2 sn’den kısa ve yakalanmadı.',
  'swallowed':'Aynı takımın daha uzun tahmini bu sahipliği içine aldı (araya giren rakip sahipliği kaçırıldı).',
  'wrong_team':'Sahipliğin çoğunda model diğer takımı söyledi.',
  'called_dead':'Sahipliğin çoğunda model ölü top dedi.',
  'split':'Aynı takım ama birden fazla parçaya bölündü.',
  'boundary':'Aynı takım, örtüşüyor ama başlangıç/bitiş kayık (IoU < 0.5).',
  'in_other_team':'Model, gerçekte rakibin topu varken sahiplik uydurdu.',
  'in_dead':'Model, gerçekte ölü topken sahiplik uydurdu.',
  'split_piece':'Gerçek bir sahipliğin parçası olan fazladan tahmin.'
};
function dec(b64, T) { const s = atob(b64); const u = new Uint8Array(s.length); for (let i=0;i<s.length;i++) u[i]=s.charCodeAt(i); return new T(u.buffer); }
const N = D.n, K = D.k, FPS = D.fps;
const BALL = dec(D.ball, Int16Array), PL = dec(D.players, Int16Array), GT = dec(D.gt, Int8Array), NEAR = dec(D.near, Int16Array);
const PRED = {}, PROB = {};
for (const p of D.packages) { PRED[p] = dec(D.preds[p], Int8Array); PROB[p] = dec(D.probs[p], Uint8Array); }
let pkg = D.packages[D.packages.length-1], cur = D.blocks[0][0], playing = false, speed = 1, win = 60;
let catOn = new Set(), sortK = 'start', sortDir = 1, curEp = -1;
const MISS = -32768;

function fmt(f) { const s = f / FPS; const h = D.blocks.findIndex(b => f < b[1]) ; const half = h < 0 ? D.blocks.length : h+1;
  const st = D.blocks[Math.max(0, half-1)][0]; const r = Math.max(0,(f - st)/FPS);
  return `${half}. yarı ${String(Math.floor(r/60)).padStart(2,'0')}:${(r%60).toFixed(1).padStart(4,'0')}`; }

// ---------- header
document.getElementById('title').textContent = D.name + '  ·  ' + (D.gt_key === 'labels' ? 'gerçek etiket: <0.5 sn birleştirilmiş' : 'gerçek etiket: ham');
function header() {
  document.getElementById('pkgs').innerHTML = D.packages.map(p => `<label class="pk ${p===pkg?'on':''}"><input type="radio" name="pk" value="${p}" ${p===pkg?'checked':''} style="display:none">${p}</label>`).join(' ');
  document.querySelectorAll('input[name=pk]').forEach(el => el.onchange = () => { pkg = el.value; catOn.clear(); header(); cats(); table(); draw(); });
  document.getElementById('scores').innerHTML = D.packages.map(p => { const s = D.scores[p] || {}; const c = D.counts[p];
    return `<span class="pill">${p}: spellF1 <b>${s.spell!==undefined?(100*s.spell).toFixed(1):'?'}</b> · macroF1 <b>${s.macro!==undefined?(100*s.macro).toFixed(1):'?'}</b> · sahiplik <b>${c.pred}</b>/${c.gt}</span>`; }).join(' ');
}
// ---------- categories + table
function cats() {
  const cnt = {}; for (const e of D.episodes[pkg]) { const k = e.kind+':'+e.cat; cnt[k] = (cnt[k]||0)+1; }
  const keys = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  document.getElementById('cats').innerHTML = keys.map(k => `<span class="cat ${catOn.has(k)?'on':''}" data-k="${k}">${k.replace('missed:','kaçırılan · ').replace('spurious:','uydurulan · ')} <b>${cnt[k]}</b></span>`).join('');
  document.querySelectorAll('.cat').forEach(el => el.onclick = () => { const k = el.dataset.k; catOn.has(k)?catOn.delete(k):catOn.add(k); cats(); table();
    document.getElementById('catnote').textContent = [...catOn].map(x=>CATNOTE[x.split(':')[1]]||'').join('  '); });
}
function visibleEps() { let e = D.episodes[pkg].map((x,i)=>({...x, i})); if (catOn.size) e = e.filter(x => catOn.has(x.kind+':'+x.cat));
  e.sort((a,b)=> (a[sortK] > b[sortK] ? 1 : a[sortK] < b[sortK] ? -1 : 0) * sortDir); return e; }
function table() {
  const rows = visibleEps();
  document.getElementById('eps').innerHTML = rows.map(e => `<tr class="ep ${e.i===curEp?'cur':''}" data-i="${e.i}"><td>${fmt(e.start)}</td><td>${e.kind==='missed'?'kaçırılan':'uydurulan'}</td><td>${e.cat}</td>
    <td><span class="sw" style="background:${COL[e.team]}"></span>${TEAMNAME[e.team]}</td><td>${e.dur.toFixed(1)} sn</td><td>${e.iou.toFixed(2)}</td><td>${Math.round(100*e.ball)}%</td><td>${Math.round(100*e.other)}% / ${Math.round(100*e.dead)}%</td></tr>`).join('');
  document.querySelectorAll('tr.ep').forEach(el => el.onclick = () => gotoEp(+el.dataset.i));
}
document.querySelectorAll('th').forEach(th => th.onclick = () => { const k = th.dataset.k; sortDir = (sortK===k) ? -sortDir : 1; sortK = k; table(); });
function gotoEp(i) { curEp = i; const e = D.episodes[pkg][i]; cur = Math.max(0, e.start - Math.round(3*FPS)); playing = false; setPlay();
  info(e); table(); draw(); const tr = document.querySelector(`tr.ep[data-i="${i}"]`); if (tr) tr.scrollIntoView({block:'nearest'}); }
function stepEp(dir) { const list = visibleEps().sort((a,b)=>a.start-b.start); if (!list.length) return;
  let nxt = dir > 0 ? list.find(e => e.start > cur + 3*FPS + 1) : [...list].reverse().find(e => e.start < cur + 3*FPS - 1);
  if (!nxt) nxt = dir > 0 ? list[0] : list[list.length-1]; gotoEp(nxt.i); }
function info(e) { document.getElementById('info').innerHTML = e ? `<b>${e.kind==='missed'?'Kaçırılan gerçek sahiplik':'Uydurulan tahmin sahipliği'}</b> · ${TEAMNAME[e.team]} · ${e.dur.toFixed(1)} sn · ${fmt(e.start)} → ${fmt(e.end)} · en iyi IoU ${e.iou} · top görünür %${Math.round(100*e.ball)}<br>${CATNOTE[e.cat]||''}` : ''; }

// ---------- pitch
const pc = document.getElementById('pitch'), px = pc.getContext('2d');
const L = D.pitch[0], W = D.pitch[1], M = 30, SC = Math.min((pc.width-2*M)/L, (pc.height-2*M)/W);
const X = x => M + x*SC, Y = y => pc.height - M - y*SC;
function drawPitch() {
  px.fillStyle = '#16301f'; px.fillRect(0,0,pc.width,pc.height);
  px.strokeStyle = 'rgba(255,255,255,.55)'; px.lineWidth = 1.5;
  px.strokeRect(X(0), Y(W), L*SC, W*SC);
  px.beginPath(); px.moveTo(X(L/2), Y(0)); px.lineTo(X(L/2), Y(W)); px.stroke();
  px.beginPath(); px.arc(X(L/2), Y(W/2), 9.15*SC, 0, 2*Math.PI); px.stroke();
  for (const side of [0,1]) { const x0 = side ? L-16.5 : 0, x1 = side ? L-5.5 : 0;
    px.strokeRect(X(x0), Y(W/2+20.16), 16.5*SC, 40.32*SC); px.strokeRect(X(x1), Y(W/2+9.16), 5.5*SC, 18.32*SC); }
}
function bxy(f) { const x = BALL[2*f], y = BALL[2*f+1]; return x===MISS ? null : [x/10, y/10]; }
function draw() {
  cur = Math.max(0, Math.min(N-1, cur));
  drawPitch();
  // ball trail (last 2 s)
  px.strokeStyle = 'rgba(255,255,255,.35)'; px.lineWidth = 2; px.beginPath(); let started = false;
  for (let f = Math.max(0, cur-2*FPS); f <= cur; f++) { const b = bxy(f); if (!b) { started = false; continue; }
    if (!started) { px.moveTo(X(b[0]), Y(b[1])); started = true; } else px.lineTo(X(b[0]), Y(b[1])); }
  px.stroke();
  // players
  const b = bxy(cur); let nearest = -1, nd = 1e9;
  for (let j = 0; j < K; j++) { const x = PL[cur*K*2+2*j], y = PL[cur*K*2+2*j+1]; if (x === MISS) continue;
    if (b) { const d = Math.hypot(x/10-b[0], y/10-b[1]); if (d < nd) { nd = d; nearest = j; } } }
  for (let j = 0; j < K; j++) { const x = PL[cur*K*2+2*j], y = PL[cur*K*2+2*j+1]; if (x === MISS) continue;
    const t = D.team[j]; px.beginPath(); px.arc(X(x/10), Y(y/10), j===nearest?9:7, 0, 2*Math.PI);
    px.fillStyle = t===0 ? COL[0] : t===1 ? COL[1] : '#d1d5db'; px.fill();
    if (j===nearest) { px.strokeStyle = '#fff'; px.lineWidth = 2; px.stroke(); } }
  // ball
  if (b) { px.beginPath(); px.arc(X(b[0]), Y(b[1]), 5, 0, 2*Math.PI); px.fillStyle = '#fff'; px.fill(); px.strokeStyle='#000'; px.lineWidth=1; px.stroke(); }
  else { let f = cur; while (f > 0 && !bxy(f) && cur - f < 10*FPS) f--; const lb = bxy(f);
    if (lb) { px.beginPath(); px.arc(X(lb[0]), Y(lb[1]), 7, 0, 2*Math.PI); px.strokeStyle = '#ef4444'; px.setLineDash([3,3]); px.lineWidth=2; px.stroke(); px.setLineDash([]); }
    px.fillStyle = '#ef4444'; px.font = '600 15px system-ui'; px.fillText('TOP YOK' + (lb ? ` (son görülme ${((cur-f)/FPS).toFixed(1)} sn önce)` : ''), M+6, M-10); }
  // state box
  const g = GT[cur], p = PRED[pkg][cur], pr = [PROB[pkg][3*cur]/255, PROB[pkg][3*cur+1]/255, PROB[pkg][3*cur+2]/255];
  px.font = '600 16px system-ui'; px.textAlign = 'right';
  px.fillStyle = COL[g] || '#888'; px.fillText(`gerçek ${TEAMNAME[g]}`, pc.width - M - 210, M - 10);
  px.fillStyle = p !== g ? '#ef4444' : (COL[p] || '#888'); px.fillText(`${pkg} ${TEAMNAME[p]}`, pc.width - M - 70, M - 10);
  px.fillStyle = '#cbd5e1'; px.font = '13px system-ui';
  px.fillText(`P(H) ${pr[0].toFixed(2)}  P(A) ${pr[1].toFixed(2)}  P(D) ${pr[2].toFixed(2)}   en yakın H ${(NEAR[2*cur]/10).toFixed(1)} m · A ${(NEAR[2*cur+1]/10).toFixed(1)} m`, pc.width - M, pc.height - 8);
  px.textAlign = 'left';
  document.getElementById('clock').textContent = `${fmt(cur)} · kare ${cur}/${N-1} · ${(cur/FPS).toFixed(1)} sn`;
  drawTL(); drawMini();
}
// ---------- timelines
const tc = document.getElementById('tl'), tx = tc.getContext('2d');
const mc = document.getElementById('mini'), mx = mc.getContext('2d');
const LEFT = 110;
function drawTL() {
  const w = tc.width - LEFT - 10, span = Math.round(win*FPS), a = Math.max(0, cur - Math.floor(span/2)), bnd = Math.min(N, a + span);
  tx.fillStyle = '#171a21'; tx.fillRect(0,0,tc.width,tc.height);
  const rows = [['gerçek', GT], ...D.packages.map(p => [p, PRED[p]])];
  const rh = 26; let y = 8;
  tx.font = '12px system-ui'; tx.textBaseline = 'middle';
  const fx = f => LEFT + (f - a) / span * w;
  for (const [name, arr] of rows) {
    tx.fillStyle = name===pkg ? '#e6e8ec' : '#8b93a3'; tx.fillText(name, 8, y + rh/2);
    let s = a; for (let f = a+1; f <= bnd; f++) if (f === bnd || arr[f] !== arr[s]) { tx.fillStyle = COL[arr[s]] || '#333'; tx.fillRect(fx(s), y, Math.max(1, fx(f)-fx(s)), rh-6); s = f; }
    if (name !== 'gerçek') { tx.fillStyle = '#ef4444'; for (let f = a; f < bnd; f++) if (GT[f] >= 0 && arr[f] !== GT[f]) tx.fillRect(fx(f), y+rh-6, Math.max(1, w/span), 3); }
    y += rh;
  }
  // probabilities of selected package (stacked)
  const ph = 70; tx.fillStyle = '#8b93a3'; tx.fillText(`P(${pkg})`, 8, y + ph/2);
  for (let f = a; f < bnd; f++) { let yy = y + ph; for (const c of [0,1,2]) { const h = PROB[pkg][3*f+c]/255*ph; tx.fillStyle = COL[c]; tx.fillRect(fx(f), yy-h, Math.max(1, w/span)+.5, h); yy -= h; } }
  tx.strokeStyle = 'rgba(255,255,255,.25)'; tx.beginPath(); tx.moveTo(LEFT, y+ph/2); tx.lineTo(LEFT+w, y+ph/2); tx.stroke();
  y += ph + 6;
  // ball visible
  tx.fillStyle = '#8b93a3'; tx.fillText('top görünür', 8, y + 7);
  for (let f = a; f < bnd; f++) { tx.fillStyle = BALL[2*f] === MISS ? '#3b1d1d' : '#d1d5db'; tx.fillRect(fx(f), y, Math.max(1, w/span)+.5, 12); }
  y += 18;
  // nearest distance lines (0-15 m)
  const dh = 50; tx.fillStyle = '#8b93a3'; tx.fillText('en yakın (m)', 8, y + dh/2);
  tx.strokeStyle = '#2a2f3a'; tx.strokeRect(LEFT, y, w, dh);
  for (const t of [0,1]) { tx.strokeStyle = COL[t]; tx.lineWidth = 1.5; tx.beginPath(); let st = false;
    for (let f = a; f < bnd; f++) { const v = NEAR[2*f+t]/10; if (v > 99 || BALL[2*f]===MISS) { st = false; continue; }
      const yy = y + dh - Math.min(v, 15)/15*dh; if (!st) { tx.moveTo(fx(f), yy); st = true; } else tx.lineTo(fx(f), yy); } tx.stroke(); }
  tx.lineWidth = 1;
  // cursor
  tx.strokeStyle = '#fff'; tx.beginPath(); tx.moveTo(fx(cur), 4); tx.lineTo(fx(cur), tc.height-4); tx.stroke();
  tc.onclick = ev => { const r = tc.getBoundingClientRect(); const xx = (ev.clientX - r.left) * tc.width / r.width; cur = Math.round(a + (xx - LEFT)/w*span); draw(); };
}
let miniCache = null, miniPkg = null;
function drawMini() {
  const w = mc.width;
  if (miniPkg !== pkg) { miniPkg = pkg; const off = document.createElement('canvas'); off.width = w; off.height = mc.height; const o = off.getContext('2d');
    o.fillStyle = '#171a21'; o.fillRect(0,0,w,mc.height);
    const per = N / w;
    for (let i = 0; i < w; i++) { const s = Math.floor(i*per), e = Math.floor((i+1)*per); let h=0,aa=0,d=0,err=0,g=0;
      for (let f = s; f < e; f++) { const v = GT[f]; if (v < 0) continue; g++; if (v===0) h++; else if (v===1) aa++; else d++; if (PRED[pkg][f] !== v) err++; }
      if (!g) continue; o.fillStyle = h>=aa&&h>=d ? COL[0] : aa>=d ? COL[1] : COL[2]; o.fillRect(i, 2, 1, 22);
      o.fillStyle = `rgba(239,68,68,${Math.min(1, err/g*1.6)})`; o.fillRect(i, 28, 1, 22); }
    miniCache = off; }
  mx.drawImage(miniCache, 0, 0);
  const span = win*FPS, x0 = (cur - span/2)/N*w;
  mx.strokeStyle = '#fff'; mx.strokeRect(x0, 1, span/N*w, mc.height-2);
}
mc.onclick = ev => { const r = mc.getBoundingClientRect(); cur = Math.round((ev.clientX - r.left)/r.width*N); draw(); };
// ---------- playback
function setPlay() { document.getElementById('play').textContent = playing ? '⏸ Durdur' : '▶ Oynat'; }
document.getElementById('play').onclick = () => { playing = !playing; setPlay(); };
document.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { const v = b.dataset.step; cur += v.endsWith('s') ? Math.round(parseFloat(v)*FPS) : +v; draw(); });
document.getElementById('speed').onchange = e => speed = +e.target.value;
document.getElementById('win').onchange = e => { win = +e.target.value; draw(); };
document.getElementById('nextep').onclick = () => stepEp(1);
document.getElementById('prevep').onclick = () => stepEp(-1);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === ' ') { playing = !playing; setPlay(); e.preventDefault(); }
  else if (e.key === 'ArrowRight') { cur += e.shiftKey ? FPS : 1; draw(); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { cur -= e.shiftKey ? FPS : 1; draw(); e.preventDefault(); }
  else if (e.key === 'n' || e.key === 'N') stepEp(1);
  else if (e.key === 'p' || e.key === 'P') stepEp(-1);
});
let last = performance.now(), acc = 0;
function loop(t) { const dt = (t - last)/1000; last = t;
  if (playing) { acc += dt * FPS * speed; const st = Math.floor(acc); if (st) { acc -= st; cur += st; if (cur >= N-1) { playing = false; setPlay(); } draw(); } }
  requestAnimationFrame(loop); }
header(); cats(); table(); draw(); requestAnimationFrame(loop);
</script>
</body>
</html>
